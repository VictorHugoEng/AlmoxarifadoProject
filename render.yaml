services:
  - type: web
    name: almoxarifado-inteligente
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALMOX_ADMIN_PASSWORD
        value: demo-almox-2026
